# nginx mTLS (Mutual TLS) reverse proxy for the local WebSocket echo server.
# Listens on wss://localhost:8768 and requires a valid client certificate
# signed by the RedfireForge Dev Root CA (ssl_verify_client on).
#
# The Node.js proxy sends the client cert+key when it connects to this server.
# The browser never directly handles TLS — it goes through the proxy.
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream ws_echo_mtls {
    server ws-echo-mtls:8080;
  }

  server {
    listen 8768 ssl;
    server_name localhost;

    # Server certificate (same leaf cert as the skip-cert/CA server)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Require a valid client certificate signed by our Dev Root CA
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client      on;

    location / {
      proxy_pass http://ws_echo_mtls;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
