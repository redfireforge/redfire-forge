# nginx TLS-terminating reverse proxy for the local WebSocket echo server.
# Listens on wss://localhost:8766 with a self-signed cert and upgrades the
# connection to the plain-ws echo backend (jmalloc/echo-server).
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Allow long-lived idle WebSocket connections.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream ws_echo_backend {
    server ws-echo-tls:8080;
  }

  server {
    listen 8766 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://ws_echo_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
