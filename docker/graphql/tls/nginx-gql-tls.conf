# nginx TLS-terminating reverse proxy for the GraphQL test server.
#
# Handles both HTTPS (HTTP POST /graphql) and WSS (WebSocket upgrade for
# GraphQL subscriptions) on port 4443, terminating TLS and proxying to the
# plain HTTP/WS Apollo Server backend.
#
# Used by the "HTTPS, TLS & Certificates" demo lesson (Phase 1 + Phase 2):
#   Phase 1 — Skip certificate validation (self-signed; rejectUnauthorized=false)
#   Phase 2 — Custom CA certificate (paste certs/ca.crt into the TLS panel)
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Support both plain HTTP POST (GraphQL queries/mutations) and
  # WebSocket upgrade (GraphQL subscriptions) at the same /graphql endpoint.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream gql_backend {
    server gql-test-server-tls:4010;
  }

  server {
    listen 4443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      proxy_pass         http://gql_backend;
      proxy_http_version 1.1;

      # WebSocket upgrade passthrough (subscriptions)
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Standard proxy headers
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Allow long-lived subscription connections and large mutation bodies
      proxy_read_timeout    3600s;
      proxy_send_timeout    3600s;
      client_max_body_size  10m;
    }
  }
}
