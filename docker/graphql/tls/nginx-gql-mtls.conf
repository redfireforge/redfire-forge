# nginx mTLS (Mutual TLS) reverse proxy for the GraphQL test server.
#
# Listens on port 4445 and requires a valid client certificate signed by the
# RedfireForge Dev Root CA (ssl_verify_client on). Connections without a valid
# client cert are rejected at the TLS handshake — before any GraphQL data
# is exchanged.
#
# Used by the "HTTPS, TLS & Certificates" demo lesson (Phase 3 — mTLS):
#   Requires: certs/ca.crt (CA cert), certs/client.crt + certs/client.key
#   See: generate-cert.sh + generate-client-cert.sh
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream gql_backend_mtls {
    server gql-test-server-mtls:4010;
  }

  server {
    listen 4445 ssl;
    server_name localhost;

    # Server certificate (same leaf cert as Phase 1+2 server)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Require a valid client certificate signed by our Dev Root CA.
    # Without a matching client cert, nginx returns a TLS alert (handshake failure)
    # and the connection is rejected before reaching the GraphQL endpoint.
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client      on;

    location / {
      proxy_pass         http://gql_backend_mtls;
      proxy_http_version 1.1;

      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_read_timeout    3600s;
      proxy_send_timeout    3600s;
      client_max_body_size  10m;
    }
  }
}
