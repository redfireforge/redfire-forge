<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swagger 2.0 → OpenAPI 3.0.3 Converter</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .drop-zone {
      border: 2px dashed #4a4a6a;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #16213e;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #4fc3f7;
      background: #1a2a4a;
    }
    .drop-zone p {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .drop-zone .hint {
      font-size: 0.85rem;
      color: #666;
    }
    input[type="file"] { display: none; }
    .result {
      margin-top: 2rem;
      display: none;
    }
    .result.visible { display: block; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .result-header h3 { color: #4fc3f7; }
    .btn {
      background: #4fc3f7;
      color: #1a1a2e;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #81d4fa; }
    .btn-group { display: flex; gap: 0.5rem; }
    .output {
      background: #0f1525;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      max-height: 500px;
      overflow: auto;
      white-space: pre;
      color: #c8e6c9;
    }
    .error {
      background: #2d1b1b;
      border-color: #e57373;
      color: #ef9a9a;
    }
    .info-bar {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #1b3a2a;
      border: 1px solid #2e7d50;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #a5d6a7;
      display: none;
    }
    .info-bar.visible { display: block; }
    .file-name {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Swagger 2.0 → OpenAPI 3.0.3</h1>
    <p class="subtitle">Drop or select a Swagger 2.0 YAML/JSON file to convert</p>

    <div class="drop-zone" id="dropZone">
      <p>📂 Drop Swagger file here or click to browse</p>
      <span class="hint">Supports .yaml, .yml, and .json files</span>
    </div>
    <input type="file" id="fileInput" accept=".yaml,.yml,.json">
    <div class="file-name" id="fileName"></div>

    <div class="info-bar" id="infoBar"></div>

    <div class="result" id="result">
      <div class="result-header">
        <h3>Converted OpenAPI 3.0.3</h3>
        <div class="btn-group">
          <button class="btn" id="downloadYaml">Download YAML</button>
          <button class="btn" id="downloadJson">Download JSON</button>
          <button class="btn" id="copyBtn">Copy</button>
        </div>
      </div>
      <pre class="output" id="output"></pre>
    </div>
  </div>
