<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Comparison – RedfireForge (11 Themes)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .page-header {
    text-align: center;
    padding: 32px 24px 16px;
    border-bottom: 1px solid #333;
  }
  .page-header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
  .page-header p { color: #888; font-size: 0.85rem; max-width: 900px; margin: 0 auto; line-height: 1.5; }

  /* ── Group labels ── */
  .tab-group {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px 16px 0;
    position: sticky;
    top: 0;
    background: #111;
    z-index: 10;
    flex-wrap: wrap;
  }
  .tab-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tab-section-label {
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #555;
    font-weight: 700;
  }
  .tab-section-tabs {
    display: flex;
    gap: 2px;
  }
  .theme-tab {
    padding: 7px 12px;
    font-size: 0.68rem;
    font-weight: 600;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #888;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    transition: all 0.2s;
    white-space: nowrap;
    line-height: 1.3;
  }
  .theme-tab:hover { color: #ccc; background: #222; }
  .theme-tab.active { background: #222; color: #fff; border-bottom-color: #222; }
  .theme-tab .rec { font-size: 0.55rem; background: #22c55e33; color: #4ade80; padding: 1px 5px; border-radius: 8px; margin-left: 3px; }
  .theme-tab .new { font-size: 0.55rem; background: #3b82f633; color: #60a5fa; padding: 1px 5px; border-radius: 8px; margin-left: 3px; }

  /* ── Panels ── */
  .theme-panel { display: none; }
  .theme-panel.active { display: block; }
  .panel-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .compare-strip {
    display: flex; gap: 2px; margin-bottom: 24px; border-radius: 12px; overflow: hidden;
  }
  .compare-strip .swatch {
    flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
  }
  .swatch-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; }
  .swatch-hex { font-size: 0.72rem; font-weight: 600; font-family: monospace; }

  .theme-desc {
    padding: 16px 20px; border-radius: 10px; margin-bottom: 20px;
    font-size: 0.8rem; line-height: 1.6; border: 1px solid #333; background: #1a1a1a;
  }
  .theme-desc strong { color: #fff; }
  .theme-desc .pros { color: #4ade80; }
  .theme-desc .cons { color: #f87171; }
  .theme-desc .ref { color: #60a5fa; font-size: 0.72rem; }

  /* ── App mock ── */
  .app-mock {
    border-radius: 12px; overflow: hidden; border: 1px solid;
    display: flex; flex-direction: column; min-height: 520px;
  }
  .mock-header {
    display: flex; align-items: center; gap: 20px; padding: 12px 20px; border-bottom: 1px solid;
  }
  .mock-logo { font-size: 0.95rem; font-weight: 700; white-space: nowrap; }
  .mock-tabs { display: flex; gap: 2px; }
  .mock-tab {
    padding: 6px 14px; font-size: 0.72rem; font-weight: 600; border-radius: 6px; opacity: 0.5;
  }
  .mock-tab.active { opacity: 1; color: #fff; }
  .mock-header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .mock-tag { font-size: 0.6rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .mock-theme-btn {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; border: 1px solid; cursor: default;
  }
  .mock-body { display: flex; flex: 1; }
  .mock-sidebar {
    width: 200px; border-right: 1px solid; padding: 10px;
    display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
  }
  .mock-sb-header {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 6px 8px; font-weight: 600;
  }
  .mock-sb-item {
    padding: 7px 10px; font-size: 0.75rem; border-radius: 6px;
    cursor: default; display: flex; align-items: center; gap: 8px;
  }
  .mock-sb-item .dot { width: 6px; height: 6px; border-radius: 50%; }
  .mock-sb-item.active { font-weight: 600; }
  .mock-subnav { display: flex; border-bottom: 1px solid; padding: 0 16px; }
  .mock-subnav-tab {
    padding: 8px 14px; font-size: 0.72rem; font-weight: 600; border-bottom: 2px solid transparent;
  }
  .mock-subnav-tab.active { border-bottom-width: 2px; border-bottom-style: solid; }
  .mock-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .mock-content { flex: 1; padding: 20px; overflow: hidden; }
  .mock-content h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; }
  .mock-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px;
  }
  .mock-card {
    padding: 14px; border-radius: 8px; border: 1px solid;
    display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden;
  }
  .mock-card-top { display: flex; align-items: flex-start; gap: 10px; }
  .mock-card-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0;
  }
  .mock-card-info { flex: 1; min-width: 0; }
  .mock-card-name { font-size: 0.78rem; font-weight: 600; margin-bottom: 2px; }
  .mock-card-desc { font-size: 0.65rem; line-height: 1.4; }
  .mock-card-pills { display: flex; gap: 3px; flex-wrap: wrap; }
  .mock-pill {
    font-size: 0.55rem; font-weight: 600; text-transform: uppercase;
    padding: 2px 6px; border-radius: 6px; border: 1px solid;
  }
  .mock-card-meta {
    display: flex; align-items: center; gap: 8px; padding-top: 6px;
    border-top: 1px solid; font-size: 0.6rem;
  }
  .mock-meta-spacer { flex: 1; }
  .mock-dots { display: flex; gap: 2px; }
  .mock-dot { width: 5px; height: 5px; border-radius: 50%; }
  .mock-statusbar {
    padding: 4px 16px; font-size: 0.6rem; border-top: 1px solid;
    display: flex; gap: 16px; align-items: center;
  }
  .mock-metrics {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px;
  }
  .mock-metric { padding: 12px; border-radius: 8px; border: 1px solid; }
  .mock-metric-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
  .mock-metric-value { font-size: 1.1rem; font-weight: 700; }
  .mock-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; margin-top: 12px; }
  .mock-table th {
    text-align: left; padding: 8px 10px; font-weight: 600;
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid;
  }
  .mock-table td { padding: 8px 10px; border-bottom: 1px solid; }
  .mock-table tr:last-child td { border-bottom: none; }
  .status-badge { font-size: 0.6rem; font-weight: 600; padding: 2px 8px; border-radius: 8px; }
  .card-stripe {
    position: absolute; top: 10px; bottom: 10px; left: 0;
    width: 3px; border-radius: 0 3px 3px 0; opacity: 0.7;
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>🎨 Theme Comparison — RedfireForge (11 Themes)</h1>
  <p>From darkest to lightest, including real-world product inspirations. Click tabs to compare full app layouts.</p>
</div>

<div class="tab-group">
  <div class="tab-section">
    <span class="tab-section-label">Dark</span>
    <div class="tab-section-tabs">
      <button class="theme-tab active" onclick="show('current',this)">Current</button>
      <button class="theme-tab" onclick="show('dim',this)">A: Dim <span class="rec">★</span></button>
      <button class="theme-tab" onclick="show('steel',this)">B: Steel</button>
      <button class="theme-tab" onclick="show('sapphire',this)">C: Sapphire</button>
    </div>
  </div>
  <div class="tab-section">
    <span class="tab-section-label">Mid-Dark</span>
    <div class="tab-section-tabs">
      <button class="theme-tab" onclick="show('dusk',this)">D: Dusk</button>
      <button class="theme-tab" onclick="show('linear',this)">E: Linear <span class="new">NEW</span></button>
      <button class="theme-tab" onclick="show('slack',this)">F: Slack <span class="new">NEW</span></button>
    </div>
  </div>
  <div class="tab-section">
    <span class="tab-section-label">Light</span>
    <div class="tab-section-tabs">
      <button class="theme-tab" onclick="show('mist',this)">G: Mist</button>
      <button class="theme-tab" onclick="show('frost',this)">H: Frost</button>
      <button class="theme-tab" onclick="show('sage',this)">I: Sage <span class="new">NEW</span></button>
      <button class="theme-tab" onclick="show('sand',this)">J: Sand <span class="new">NEW</span></button>
    </div>
  </div>
</div>

<script>
const T = {
  current:  { bg:'#0f172a', sf:'#1e293b', hv:'#334155', bd:'#334155', tx:'#e2e8f0', tm:'#94a3b8', ac:'#3b82f6', icon:'🌙' },
  dim:      { bg:'#1c2128', sf:'#2d333b', hv:'#373e47', bd:'#444c56', tx:'#adbac7', tm:'#768390', ac:'#3b82f6', icon:'🌗' },
  steel:    { bg:'#1e1e1e', sf:'#252526', hv:'#2a2d2e', bd:'#3c3c3c', tx:'#cccccc', tm:'#858585', ac:'#2563eb', icon:'🌗' },
  sapphire: { bg:'#0f1923', sf:'#182636', hv:'#1f3045', bd:'#2a4058', tx:'#d0dce8', tm:'#7a9ab5', ac:'#3b82f6', icon:'🌙' },
  dusk:     { bg:'#282c34', sf:'#333842', hv:'#3e4451', bd:'#4b5263', tx:'#abb2bf', tm:'#636d83', ac:'#528bff', icon:'🌗' },
  // Linear-inspired: elevated surfaces, slightly purple-tinted dark
  linear:   { bg:'#19181c', sf:'#27262b', hv:'#323137', bd:'#3e3d44', tx:'#d4d4d8', tm:'#82828c', ac:'#8b5cf6', icon:'🌗' },
  // Slack-inspired: aubergine sidebar feel, warm dark
  slack:    { bg:'#1a1d21', sf:'#27292d', hv:'#33363b', bd:'#424548', tx:'#d1d2d3', tm:'#9a9b9d', ac:'#36c5f0', icon:'🌗' },
  // Soft gray-blue light
  mist:     { bg:'#e8ecf1', sf:'#ffffff', hv:'#f0f3f7', bd:'#d0d7e0', tx:'#2c3e50', tm:'#6b7c93', ac:'#3b82f6', icon:'☀️' },
  // Cool slate-white light
  frost:    { bg:'#f0f4f8', sf:'#ffffff', hv:'#e8edf3', bd:'#c9d4e0', tx:'#1a2b3c', tm:'#5a6f85', ac:'#2563eb', icon:'☀️' },
  // Warm sage/olive light (FeedBacker-inspired)
  sage:     { bg:'#e8ebe4', sf:'#f5f5f0', hv:'#edeee8', bd:'#c8cdc0', tx:'#2d3328', tm:'#6b7265', ac:'#5a8a5e', icon:'☀️' },
  // Warm sand/cream light (Notion-inspired)
  sand:     { bg:'#f4f0e8', sf:'#ffffff', hv:'#f0ece4', bd:'#d9d2c4', tx:'#37352f', tm:'#787570', ac:'#d97706', icon:'☀️' },
};

function isLight(t) { return ['mist','frost','sage','sand'].includes(t); }
function passBg(t) { return isLight(t) ? 'background:rgba(22,163,74,0.12);color:#16a34a' : 'background:rgba(34,197,94,0.15);color:#4ade80'; }
function failBg(t) { return isLight(t) ? 'background:rgba(220,38,38,0.1);color:#dc2626' : 'background:rgba(239,68,68,0.15);color:#f87171'; }
function projTag(t) {
  if (t==='sage') return 'background:rgba(90,138,94,0.12);color:#5a8a5e;border:1px solid rgba(90,138,94,0.25)';
  if (t==='sand') return 'background:rgba(217,119,6,0.12);color:#b45309;border:1px solid rgba(217,119,6,0.25)';
  return isLight(t) ? 'background:rgba(124,58,237,0.1);color:#7c3aed;border:1px solid rgba(124,58,237,0.25)'
    : 'background:rgba(183,148,244,0.15);color:#b794f4;border:1px solid rgba(183,148,244,0.3)';
}
function envTag(t) {
  if (t==='sage') return 'background:rgba(90,138,94,0.15);color:#3d6e40;border:1px solid rgba(90,138,94,0.3)';
  if (t==='sand') return 'background:rgba(22,163,74,0.1);color:#16a34a;border:1px solid rgba(22,163,74,0.2)';
  return isLight(t) ? 'background:rgba(22,163,74,0.1);color:#16a34a;border:1px solid rgba(22,163,74,0.25)'
    : 'background:rgba(104,211,145,0.15);color:#68d391;border:1px solid rgba(104,211,145,0.3)';
}
function successVal(t) { return isLight(t) ? '#16a34a' : '#22c55e'; }
function pillIcon(cat) {
  const m = { api:'rgba(96,165,250,0.12)', flow:'rgba(167,139,250,0.12)', event:'rgba(52,211,153,0.12)' };
  return m[cat] || m.api;
}

const descs = {
  current: `<strong>Current Dark</strong> — Deep navy-black (Tailwind Slate 900/800). Very dark; low contrast between bg and surface.<br><span class="cons">⚠ bg→surface contrast ~1.3:1 — cards feel sunken</span>`,

  dim: `<strong>A: Dim</strong> — GitHub Dark Dimmed. Warmer gray-blue, noticeably more layering. Cards float. <span class="pros">★ Recommended</span><br><span class="pros">✓ ~1.6:1 bg→surface contrast</span> · <span class="pros">✓ Proven at GitHub scale</span> · <span class="pros">✓ Warm-neutral</span>`,

  steel: `<strong>B: Steel</strong> — VS Code neutral gray. Zero color tint. Familiar but can feel flat.<br><span class="pros">✓ Zero tint — clean</span> · <span class="cons">⚠ Can feel industrial for dashboards</span>`,

  sapphire: `<strong>C: Sapphire</strong> — Deep teal-blue. Keeps your blue DNA. ArgoCD-like.<br><span class="pros">✓ Keeps blue identity</span> · <span class="cons">⚠ Still fairly dark</span>`,

  dusk: `<strong>D: Dusk</strong> — Atom One Dark. A "mid-dark" — 20% lighter than current, warm slate.<br><span class="pros">✓ Much better readability</span> · <span class="pros">✓ Popular (Atom, JetBrains)</span>`,

  linear: `<strong>E: Linear</strong> <span class="new" style="font-size:0.7rem;background:#3b82f633;color:#60a5fa;padding:1px 6px;border-radius:8px">NEW</span> — Inspired by <span class="ref">linear.app</span>. Slightly purple-tinted dark with clean elevated surfaces. Premium, minimal feel. Accent purple (#8b5cf6) instead of blue.<br><span class="pros">✓ Premium product feel</span> · <span class="pros">✓ Great surface elevation</span> · <span class="pros">✓ Modern & trendy</span>`,

  slack: `<strong>F: Slack</strong> <span class="new" style="font-size:0.7rem;background:#3b82f633;color:#60a5fa;padding:1px 6px;border-radius:8px">NEW</span> — Inspired by <span class="ref">Slack dark mode</span>. Warm neutral dark with no blue/purple tint. Slightly warmer than Steel. Accent teal-cyan (#36c5f0) gives a distinctive look.<br><span class="pros">✓ Warm without being tinted</span> · <span class="pros">✓ Excellent readability</span> · <span class="pros">✓ Distinctive accent color</span>`,

  mist: `<strong>G: Mist</strong> — Soft gray-blue light. NOT pure white — bg is #e8ecf1. White cards on muted background give depth. Apple/Linear light.<br><span class="pros">✓ No pure-white glare</span> · <span class="pros">✓ Cards clearly elevated</span>`,

  frost: `<strong>H: Frost</strong> — Cooler, brighter than Mist. Near-white bg with slate-blue tint. Notion/Linear light.<br><span class="pros">✓ Maximum readability</span> · <span class="cons">⚠ Brightest option</span>`,

  sage: `<strong>I: Sage</strong> <span class="new" style="font-size:0.7rem;background:#3b82f633;color:#60a5fa;padding:1px 6px;border-radius:8px">NEW</span> — Inspired by your <span class="ref">FeedBacker screenshot</span> and Radix UI olive/sage scales. Warm earthy olive-green tones. Very distinctive — stands apart from generic blue/gray themes. Green accent ties into the palette.<br><span class="pros">✓ Warm & calming</span> · <span class="pros">✓ Unique identity — not "yet another gray"</span> · <span class="pros">✓ Easy on eyes for long sessions</span> · <span class="cons">⚠ Unconventional for dev tools</span>`,

  sand: `<strong>J: Sand</strong> <span class="new" style="font-size:0.7rem;background:#3b82f633;color:#60a5fa;padding:1px 6px;border-radius:8px">NEW</span> — Inspired by <span class="ref">Notion</span> and Radix UI sand/stone scales. Warm cream/beige — feels like paper. Amber accent. Clean and approachable, great for readability without clinical coolness.<br><span class="pros">✓ Warm & approachable</span> · <span class="pros">✓ Paper-like readability</span> · <span class="pros">✓ Familiar from Notion/docs tools</span>`,
};

function buildCard(c, stripe, cat, emoji, name, desc, pills, nodes, dots, diff) {
  return `<div class="mock-card" style="background:${c.sf};border-color:${c.bd}">
    <div class="card-stripe" style="background:${stripe}"></div>
    <div class="mock-card-top">
      <div class="mock-card-icon" style="background:${pillIcon(cat)}">${emoji}</div>
      <div class="mock-card-info">
        <div class="mock-card-name" style="color:${c.tx}">${name}</div>
        <div class="mock-card-desc" style="color:${c.tm}">${desc}</div>
      </div>
    </div>
    <div class="mock-card-pills">${pills.map(p=>`<span class="mock-pill" style="color:${c.tm};border-color:${c.bd}">${p}</span>`).join('')}</div>
    <div class="mock-card-meta" style="color:${c.tm};border-color:${c.bd}">
      <span>${nodes} nodes</span><span class="mock-meta-spacer"></span>
      <div class="mock-dots">${dots.map(d=>`<span class="mock-dot" style="background:${d}"></span>`).join('')}</div>
      <span>${diff}</span>
    </div>
  </div>`;
}

function buildPanel(id, c, desc) {
  const stripes = { api:'#60a5fa', flow:'#a78bfa', event:'#34d399' };
  const easyDots = [isLight(id)?'#16a34a':'#4ade80', c.bd, c.bd];
  const medDots  = [isLight(id)?'#d97706':'#fbbf24', isLight(id)?'#d97706':'#fbbf24', c.bd];

  return `
  <div class="theme-panel${id==='current'?' active':''}" id="panel-${id}">
  <div class="panel-wrap">
    <div class="theme-desc">${desc}</div>
    <div class="compare-strip">
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Background</span><span class="swatch-hex" style="color:${c.tx}">${c.bg}</span></div>
      <div class="swatch" style="background:${c.sf}"><span class="swatch-label" style="color:${c.tm}">Surface</span><span class="swatch-hex" style="color:${c.tx}">${c.sf}</span></div>
      <div class="swatch" style="background:${c.hv}"><span class="swatch-label" style="color:${c.tm}">Hover</span><span class="swatch-hex" style="color:${c.tx}">${c.hv}</span></div>
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Border</span><span class="swatch-hex" style="color:${c.bd}">${c.bd}</span></div>
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Text</span><span class="swatch-hex" style="color:${c.tx}">${c.tx}</span></div>
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Muted</span><span class="swatch-hex" style="color:${c.tm}">${c.tm}</span></div>
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Accent</span><span class="swatch-hex" style="color:${c.ac}">${c.ac}</span></div>
    </div>

    <div class="app-mock" style="border-color:${c.bd};background:${c.bg}">
      <div class="mock-header" style="background:${c.sf};border-color:${c.bd}">
        <div class="mock-logo" style="color:${c.tx}">🔥 RedfireForge</div>
        <div class="mock-tabs">
          <div class="mock-tab" style="color:${c.tm}">Requests</div>
          <div class="mock-tab active" style="background:${c.ac}">Workflow</div>
          <div class="mock-tab" style="color:${c.tm}">Runner</div>
          <div class="mock-tab" style="color:${c.tm}">Results</div>
        </div>
        <div class="mock-header-right">
          <span class="mock-tag" style="${projTag(id)}">proj-main</span>
          <span class="mock-tag" style="${envTag(id)}">t01</span>
          <div class="mock-theme-btn" style="background:${c.hv};border-color:${c.bd};color:${c.tx}">${c.icon}</div>
        </div>
      </div>
      <div class="mock-body">
        <div class="mock-sidebar" style="background:${c.bg};border-color:${c.bd}">
          <div class="mock-sb-header" style="color:${c.tm}">Harness</div>
          <div class="mock-sb-item active" style="background:${c.sf};color:${c.tx}"><span class="dot" style="background:${successVal(id)}"></span>API Tests</div>
          <div class="mock-sb-item" style="color:${c.tm}"><span class="dot" style="background:${c.tm}"></span>Load Tests</div>
          <div class="mock-sb-item" style="color:${c.tm}"><span class="dot" style="background:${successVal(id)}"></span>Smoke Tests</div>
          <div class="mock-sb-header" style="color:${c.tm};margin-top:8px">Catalog</div>
          <div class="mock-sb-item" style="color:${c.tm}"><span class="dot" style="background:${c.ac}"></span>User API v2</div>
          <div class="mock-sb-item" style="color:${c.tm}"><span class="dot" style="background:${c.ac}"></span>Orders API</div>

const wrap = document.createElement('div');
for (const [id, c] of Object.entries(T)) {
  wrap.innerHTML += buildPanel(id, c, descs[id]);
}
document.body.appendChild(wrap);

function show(id, btn) {
  document.querySelectorAll('.theme-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.theme-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  btn.classList.add('active');
}
