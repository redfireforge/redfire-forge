<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark navy background — matches the app's dark theme -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>

  <!-- Anvil base: two stacked dark bars, subtle -->
  <rect x="120" y="388" width="272" height="26" rx="4" fill="#1e293b"/>
  <rect x="152" y="414" width="208" height="18" rx="3" fill="#1e293b" opacity="0.75"/>

  <!-- Struck wedge: bold red pentagon, freshly forged, pointing up -->
  <!-- Points: top apex, right shoulder, bottom-right, bottom-left, left shoulder -->
  <path d="M 256,88 L 360,268 L 344,388 L 168,388 L 152,268 Z"
        fill="#dc2626"/>

  <!-- Right-half shadow: gives depth without a gradient (flat design) -->
  <path d="M 256,88 L 360,268 L 344,388 L 256,388 Z"
        fill="#7f1d1d" opacity="0.55"/>

  <!-- Bright hot tip: darker?hotter reads as "freshly struck, still glowing" -->
  <path d="M 256,88 L 306,178 L 206,178 Z" fill="#f97316"/>
  <path d="M 256,88 L 284,138 L 228,138 Z" fill="#fbbf24"/>

  <!-- Bright center highlight at the apex — the tiniest spot of white-hot metal -->
  <circle cx="256" cy="112" r="7" fill="#fefce8"/>

  <!-- Struck sparks: angular fragments flying from the shoulders (not soft dots) -->
  <!-- Left-side spark cluster -->
  <path d="M 138,238 L 148,224 L 152,242 L 142,252 Z" fill="#f97316"/>
  <path d="M 104,222 L 116,214 L 118,228 Z" fill="#fbbf24"/>
  <path d="M 128,196 L 138,190 L 140,204 Z" fill="#fed7aa" opacity="0.85"/>

  <!-- Right-side spark cluster -->
  <path d="M 374,238 L 364,224 L 360,242 L 370,252 Z" fill="#f97316"/>
  <path d="M 408,222 L 396,214 L 394,228 Z" fill="#fbbf24"/>
  <path d="M 384,196 L 374,190 L 372,204 Z" fill="#fed7aa" opacity="0.85"/>

  <!-- A single small ember arcing up-left, adds asymmetric life -->
  <circle cx="98" cy="184" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="418" cy="176" r="2.5" fill="#fbbf24" opacity="0.65"/>
</svg>
