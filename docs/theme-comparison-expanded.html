<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Comparison – RedfireForge (Expanded)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .page-header {
    text-align: center;
    padding: 32px 24px 16px;
    border-bottom: 1px solid #333;
  }
  .page-header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
  .page-header p { color: #888; font-size: 0.85rem; max-width: 800px; margin: 0 auto; line-height: 1.5; }

  /* ── Tabs ── */
  .theme-tabs {
    display: flex;
    justify-content: center;
    gap: 3px;
    padding: 20px 16px 0;
    position: sticky;
    top: 0;
    background: #111;
    z-index: 10;
    flex-wrap: wrap;
  }
  .theme-tab {
    padding: 8px 16px;
    font-size: 0.72rem;
    font-weight: 600;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #888;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .theme-tab:hover { color: #ccc; background: #222; }
  .theme-tab.active { background: #222; color: #fff; border-bottom-color: #222; }
  .theme-tab .rec { font-size: 0.58rem; background: #22c55e33; color: #4ade80; padding: 1px 5px; border-radius: 8px; margin-left: 4px; }
  .theme-tab .new { font-size: 0.58rem; background: #3b82f633; color: #60a5fa; padding: 1px 5px; border-radius: 8px; margin-left: 4px; }
  .theme-tab .group-label { font-size: 0.55rem; display: block; color: #666; margin-top: 1px; }

  /* ── Panels ── */
  .theme-panel { display: none; }
  .theme-panel.active { display: block; }
  .panel-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* ── Compare strip ── */
  .compare-strip {
    display: flex;
    gap: 2px;
    margin-bottom: 24px;
    border-radius: 12px;
    overflow: hidden;
  }
  .compare-strip .swatch {
    flex: 1;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .swatch-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; }
  .swatch-hex { font-size: 0.72rem; font-weight: 600; font-family: monospace; }

  /* ── Description ── */
  .theme-desc {
    padding: 16px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 0.8rem;
    line-height: 1.6;
    border: 1px solid #333;
    background: #1a1a1a;
  }
  .theme-desc strong { color: #fff; }
  .theme-desc .pros { color: #4ade80; }
  .theme-desc .cons { color: #f87171; }

  /* ── App mock ── */
  .app-mock {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid;
    display: flex;
    flex-direction: column;
    min-height: 520px;
  }
  .mock-header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid;
  }
  .mock-logo { font-size: 0.95rem; font-weight: 700; white-space: nowrap; }
  .mock-tabs { display: flex; gap: 2px; }
  .mock-tab {
    padding: 6px 14px;
    font-size: 0.72rem;
    font-weight: 600;
    border-radius: 6px;
    opacity: 0.5;
  }
  .mock-tab.active { opacity: 1; color: #fff; }
  .mock-header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .mock-tag {
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .mock-theme-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    border: 1px solid;
    cursor: default;
  }
  .mock-body { display: flex; flex: 1; }
  .mock-sidebar {
    width: 200px;
    border-right: 1px solid;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .mock-sb-header {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 8px;
    font-weight: 600;
  }
  .mock-sb-item {
    padding: 7px 10px;
    font-size: 0.75rem;
    border-radius: 6px;
    cursor: default;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mock-sb-item .dot { width: 6px; height: 6px; border-radius: 50%; }
  .mock-sb-item.active { font-weight: 600; }
  .mock-subnav {
    display: flex;
    border-bottom: 1px solid;
    padding: 0 16px;
  }
  .mock-subnav-tab {
    padding: 8px 14px;
    font-size: 0.72rem;
    font-weight: 600;
    border-bottom: 2px solid transparent;
  }
  .mock-subnav-tab.active { border-bottom-width: 2px; border-bottom-style: solid; }
  .mock-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .mock-content { flex: 1; padding: 20px; overflow: hidden; }
  .mock-content h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; }
  .mock-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }
  .mock-card {
    padding: 14px;
    border-radius: 8px;
    border: 1px solid;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .mock-card-top { display: flex; align-items: flex-start; gap: 10px; }
  .mock-card-icon {
    width: 34px; height: 34px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .mock-card-info { flex: 1; min-width: 0; }
  .mock-card-name { font-size: 0.78rem; font-weight: 600; margin-bottom: 2px; }
  .mock-card-desc { font-size: 0.65rem; line-height: 1.4; }
  .mock-card-pills { display: flex; gap: 3px; flex-wrap: wrap; }
  .mock-pill {
    font-size: 0.55rem;
    font-weight: 600;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 6px;
    border: 1px solid;
  }
  .mock-card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 6px;
    border-top: 1px solid;
    font-size: 0.6rem;
  }
  .mock-meta-spacer { flex: 1; }
  .mock-dots { display: flex; gap: 2px; }
  .mock-dot { width: 5px; height: 5px; border-radius: 50%; }
  .mock-statusbar {
    padding: 4px 16px;
    font-size: 0.6rem;
    border-top: 1px solid;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .mock-metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .mock-metric {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid;
  }
  .mock-metric-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
  .mock-metric-value { font-size: 1.1rem; font-weight: 700; }
  .mock-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.72rem;
    margin-top: 12px;
  }
  .mock-table th {
    text-align: left;
    padding: 8px 10px;
    font-weight: 600;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    border-bottom: 1px solid;
  }
  .mock-table td { padding: 8px 10px; border-bottom: 1px solid; }
  .mock-table tr:last-child td { border-bottom: none; }
  .status-badge {
    font-size: 0.6rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 8px;
  }

  /* Accent stripe on card */
  .card-stripe {
    position: absolute;
    top: 10px; bottom: 10px; left: 0;
    width: 3px;
    border-radius: 0 3px 3px 0;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>🎨 Theme Comparison — RedfireForge (Expanded)</h1>
  <p>7 themes from darkest to lightest. Click each tab to compare. Dark group on left, lighter group on right.</p>
</div>

<div class="theme-tabs">
  <button class="theme-tab active" onclick="show('current')">Current Dark<span class="group-label">DARK</span></button>
  <button class="theme-tab" onclick="show('dim')">A: Dim <span class="rec">★ REC</span><span class="group-label">DARK</span></button>
  <button class="theme-tab" onclick="show('steel')">B: Steel<span class="group-label">DARK</span></button>
  <button class="theme-tab" onclick="show('sapphire')">C: Sapphire<span class="group-label">DARK</span></button>
  <button class="theme-tab" onclick="show('dusk')">D: Dusk <span class="new">NEW</span><span class="group-label">MID</span></button>
  <button class="theme-tab" onclick="show('mist')">E: Mist <span class="new">NEW</span><span class="group-label">LIGHT</span></button>
  <button class="theme-tab" onclick="show('frost')">F: Frost <span class="new">NEW</span><span class="group-label">LIGHT</span></button>
</div>

<script>
// Theme definitions — one source of truth
const T = {
  current:  { bg:'#0f172a', sf:'#1e293b', hv:'#334155', bd:'#334155', tx:'#e2e8f0', tm:'#94a3b8', ac:'#3b82f6', icon:'🌙' },
  dim:      { bg:'#1c2128', sf:'#2d333b', hv:'#373e47', bd:'#444c56', tx:'#adbac7', tm:'#768390', ac:'#3b82f6', icon:'🌗' },
  steel:    { bg:'#1e1e1e', sf:'#252526', hv:'#2a2d2e', bd:'#3c3c3c', tx:'#cccccc', tm:'#858585', ac:'#2563eb', icon:'🌗' },
  sapphire: { bg:'#0f1923', sf:'#182636', hv:'#1f3045', bd:'#2a4058', tx:'#d0dce8', tm:'#7a9ab5', ac:'#3b82f6', icon:'🌙' },
  dusk:     { bg:'#282c34', sf:'#333842', hv:'#3e4451', bd:'#4b5263', tx:'#abb2bf', tm:'#636d83', ac:'#528bff', icon:'🌗' },
  mist:     { bg:'#e8ecf1', sf:'#ffffff', hv:'#f0f3f7', bd:'#d0d7e0', tx:'#2c3e50', tm:'#6b7c93', ac:'#3b82f6', icon:'☀️' },
  frost:    { bg:'#f0f4f8', sf:'#ffffff', hv:'#e8edf3', bd:'#c9d4e0', tx:'#1a2b3c', tm:'#5a6f85', ac:'#2563eb', icon:'☀️' },
};

// Status badge helpers per theme
function passBg(t) {
  return isLight(t)
    ? 'background:rgba(22,163,74,0.12);color:#16a34a'
    : 'background:rgba(34,197,94,0.15);color:#4ade80';
}
function failBg(t) {
  return isLight(t)
    ? 'background:rgba(220,38,38,0.1);color:#dc2626'
    : 'background:rgba(239,68,68,0.15);color:#f87171';
}
function isLight(t) { return t === 'mist' || t === 'frost'; }

function projTag(t) {
  return isLight(t)
    ? 'background:rgba(124,58,237,0.1);color:#7c3aed;border:1px solid rgba(124,58,237,0.25)'
    : 'background:rgba(183,148,244,0.15);color:#b794f4;border:1px solid rgba(183,148,244,0.3)';
}
function envTag(t) {
  return isLight(t)
    ? 'background:rgba(22,163,74,0.1);color:#16a34a;border:1px solid rgba(22,163,74,0.25)'
    : 'background:rgba(104,211,145,0.15);color:#68d391;border:1px solid rgba(104,211,145,0.3)';
}
function successVal(t) { return isLight(t) ? '#16a34a' : '#22c55e'; }

function pillIcon(t, cat) {
  const map = { api:'rgba(96,165,250,0.12)', flow:'rgba(167,139,250,0.12)', event:'rgba(52,211,153,0.12)' };
  return map[cat] || map.api;
}

// Build a panel
function buildPanel(id, c, title, desc) {
  const stripes = { api:'#60a5fa', flow:'#a78bfa', event:'#34d399' };
  const dotColors = {
    easy: [isLight(id)?'#16a34a':'#4ade80', c.bd, c.bd],
    medium: [isLight(id)?'#d97706':'#fbbf24', isLight(id)?'#d97706':'#fbbf24', c.bd],
  };

  return `
  <div class="theme-panel${id==='current'?' active':''}" id="panel-${id}">
  <div class="panel-wrap">
    <div class="theme-desc">${desc}</div>
    <div class="compare-strip">
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Background</span><span class="swatch-hex" style="color:${c.tx}">${c.bg}</span></div>
      <div class="swatch" style="background:${c.sf}"><span class="swatch-label" style="color:${c.tm}">Surface</span><span class="swatch-hex" style="color:${c.tx}">${c.sf}</span></div>
      <div class="swatch" style="background:${c.hv}"><span class="swatch-label" style="color:${c.tm}">Hover</span><span class="swatch-hex" style="color:${c.tx}">${c.hv}</span></div>
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Border</span><span class="swatch-hex" style="color:${c.bd}">${c.bd}</span></div>
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Text</span><span class="swatch-hex" style="color:${c.tx}">${c.tx}</span></div>
      <div class="swatch" style="background:${c.bg}"><span class="swatch-label" style="color:${c.tm}">Muted</span><span class="swatch-hex" style="color:${c.tm}">${c.tm}</span></div>
    </div>

    <div class="app-mock" style="border-color:${c.bd};background:${c.bg}">
      <!-- Header -->
      <div class="mock-header" style="background:${c.sf};border-color:${c.bd}">
        <div class="mock-logo" style="color:${c.tx}">🔥 RedfireForge</div>
        <div class="mock-tabs">
          <div class="mock-tab" style="color:${c.tm}">Requests</div>
          <div class="mock-tab active" style="background:${c.ac}">Workflow</div>
          <div class="mock-tab" style="color:${c.tm}">Runner</div>
          <div class="mock-tab" style="color:${c.tm}">Results</div>
        </div>
        <div class="mock-header-right">
          <span class="mock-tag" style="${projTag(id)}">proj-main</span>
          <span class="mock-tag" style="${envTag(id)}">t01</span>
          <div class="mock-theme-btn" style="background:${c.hv};border-color:${c.bd};color:${c.tx}">${c.icon}</div>
        </div>
      </div>
      <div class="mock-body">
        <!-- Sidebar -->
        <div class="mock-sidebar" style="background:${c.bg};border-color:${c.bd}">
          <div class="mock-sb-header" style="color:${c.tm}">Harness</div>
          <div class="mock-sb-item active" style="background:${c.sf};color:${c.tx}"><span class="dot" style="background:${successVal(id)}"></span>API Tests</div>
          <div class="mock-sb-item" style="color:${c.tm}"><span class="dot" style="background:${c.tm}"></span>Load Tests</div>
          <div class="mock-sb-item" style="color:${c.tm}"><span class="dot" style="background:${successVal(id)}"></span>Smoke Tests</div>
          <div class="mock-sb-header" style="color:${c.tm};margin-top:8px">Catalog</div>
          <div class="mock-sb-item" style="color:${c.tm}"><span class="dot" style="background:${c.ac}"></span>User API v2</div>
          <div class="mock-sb-item" style="color:${c.tm}"><span class="dot" style="background:${c.ac}"></span>Orders API</div>
        </div>
        <div class="mock-main">
          <!-- Subnav -->
          <div class="mock-subnav" style="background:${c.sf};border-color:${c.bd}">
            <div class="mock-subnav-tab" style="color:${c.tm}">Designer</div>
            <div class="mock-subnav-tab" style="color:${c.tm}">Executions</div>
            <div class="mock-subnav-tab" style="color:${c.tm}">Webhooks</div>
            <div class="mock-subnav-tab active" style="color:${c.tx};border-bottom-color:${c.ac}">Gallery</div>
          </div>
          <!-- Content -->
          <div class="mock-content" style="background:${c.bg}">
            <h3 style="color:${c.tx}">Template Gallery</h3>
            <div class="mock-cards">
              ${buildCard(c, stripes.api, 'api', '🔗', 'REST Chain', 'Sequential HTTP calls with variable extraction', ['HTTP','CONDITION'], 5, dotColors.easy, 'easy')}
              ${buildCard(c, stripes.flow, 'flow', '🔀', 'Switch Router', 'Multi-way branching with case matching', ['SWITCH','HTTP'], 7, dotColors.medium, 'medium')}
              ${buildCard(c, stripes.event, 'event', '📡', 'Webhook Listener', 'Event-driven workflow triggered by webhook', ['WEBHOOK','HTTP'], 4, dotColors.easy, 'easy')}
            </div>

            <h3 style="color:${c.tx};margin-top:20px">Recent Results</h3>
            <div class="mock-metrics">
              <div class="mock-metric" style="background:${c.sf};border-color:${c.bd}"><div class="mock-metric-label" style="color:${c.tm}">TPS</div><div class="mock-metric-value" style="color:${c.tx}">142.5</div></div>
              <div class="mock-metric" style="background:${c.sf};border-color:${c.bd}"><div class="mock-metric-label" style="color:${c.tm}">Avg Response</div><div class="mock-metric-value" style="color:${c.tx}">234ms</div></div>
              <div class="mock-metric" style="background:${c.sf};border-color:${c.bd}"><div class="mock-metric-label" style="color:${c.tm}">Error Rate</div><div class="mock-metric-value" style="color:${successVal(id)}">0.2%</div></div>
              <div class="mock-metric" style="background:${c.sf};border-color:${c.bd}"><div class="mock-metric-label" style="color:${c.tm}">P95</div><div class="mock-metric-value" style="color:${c.tx}">412ms</div></div>
            </div>
            <table class="mock-table">
              <tr><th style="color:${c.tm};border-color:${c.bd}">Test Name</th><th style="color:${c.tm};border-color:${c.bd}">Status</th><th style="color:${c.tm};border-color:${c.bd}">Time</th><th style="color:${c.tm};border-color:${c.bd}">URL</th></tr>
              <tr style="background:${c.sf}"><td style="color:${c.tx};border-color:${c.bd}">Create User</td><td style="border-color:${c.bd}"><span class="status-badge" style="${passBg(id)}">PASS</span></td><td style="color:${c.tm};border-color:${c.bd}">142ms</td><td style="color:${c.tm};border-color:${c.bd}">/api/users</td></tr>
              <tr><td style="color:${c.tx};border-color:${c.bd}">Get Order</td><td style="border-color:${c.bd}"><span class="status-badge" style="${passBg(id)}">PASS</span></td><td style="color:${c.tm};border-color:${c.bd}">89ms</td><td style="color:${c.tm};border-color:${c.bd}">/api/orders/123</td></tr>
              <tr style="background:${c.sf}"><td style="color:${c.tx};border-color:${c.bd}">Delete Session</td><td style="border-color:${c.bd}"><span class="status-badge" style="${failBg(id)}">FAIL</span></td><td style="color:${c.tm};border-color:${c.bd}">1204ms</td><td style="color:${c.tm};border-color:${c.bd}">/api/sessions/abc</td></tr>
            </table>
          </div>
        </div>
      </div>
      <div class="mock-statusbar" style="background:${c.sf};border-color:${c.bd};color:${c.tm}">
        <span>🟢 Connected</span><span>Worker: active</span><span style="margin-left:auto">v2.8.0</span>
      </div>
    </div>
  </div>
  </div>`;
}

function buildCard(c, stripe, cat, emoji, name, desc, pills, nodes, dots, diff) {
  return `<div class="mock-card" style="background:${c.sf};border-color:${c.bd}">
    <div class="card-stripe" style="background:${stripe}"></div>
    <div class="mock-card-top">
      <div class="mock-card-icon" style="background:${pillIcon(null, cat)}">${emoji}</div>
      <div class="mock-card-info">
        <div class="mock-card-name" style="color:${c.tx}">${name}</div>
        <div class="mock-card-desc" style="color:${c.tm}">${desc}</div>
      </div>
    </div>
    <div class="mock-card-pills">${pills.map(p=>`<span class="mock-pill" style="color:${c.tm};border-color:${c.bd}">${p}</span>`).join('')}</div>
    <div class="mock-card-meta" style="color:${c.tm};border-color:${c.bd}">
      <span>${nodes} nodes</span><span class="mock-meta-spacer"></span>
      <div class="mock-dots">${dots.map(d=>`<span class="mock-dot" style="background:${d}"></span>`).join('')}</div>
      <span>${diff}</span>
    </div>
  </div>`;
}

// Descriptions
const descs = {
  current: `<strong>Current Dark</strong> — Deep navy-black (Tailwind Slate 900/800). Very dark; low contrast between bg and surface.<br><span class="cons">⚠ bg→surface contrast ~1.3:1 — cards feel sunken, not elevated</span>`,

  dim: `<strong>Option A: Dim</strong> — GitHub Dark Dimmed. Warmer gray-blue, noticeably more layering. Cards float above background. <span class="pros">★ Recommended</span><br><span class="pros">✓ ~1.6:1 bg→surface contrast</span> · <span class="pros">✓ Proven at GitHub scale</span> · <span class="pros">✓ Warm-neutral, not cold</span>`,

  steel: `<strong>Option B: Steel</strong> — VS Code neutral gray. Zero color tint. Familiar but can feel flat for product UI.<br><span class="pros">✓ Zero tint — clean</span> · <span class="cons">⚠ Can feel industrial/editor-like for dashboards</span>`,

  sapphire: `<strong>Option C: Sapphire</strong> — Deep teal-blue with stronger layering. Keeps your blue DNA. Similar to ArgoCD.<br><span class="pros">✓ Keeps blue identity</span> · <span class="cons">⚠ Still fairly dark — base luminosity similar to current</span>`,

  dusk: `<strong>Option D: Dusk</strong> <span class="new" style="font-size:0.7rem;background:#3b82f633;color:#60a5fa;padding:1px 6px;border-radius:8px">NEW</span> — One-Dark inspired (Atom/JetBrains). A "mid-dark" that sits between dark and light. Noticeably brighter than options A-C but still unmistakably dark. Warm slate undertone.<br><span class="pros">✓ Much better readability — bg #282c34 is ~20% lighter than current</span> · <span class="pros">✓ Borders actually visible</span> · <span class="pros">✓ Popular with developers (Atom, VS Code One Dark Pro)</span>`,

  mist: `<strong>Option E: Mist</strong> <span class="new" style="font-size:0.7rem;background:#3b82f633;color:#60a5fa;padding:1px 6px;border-radius:8px">NEW</span> — Soft gray-blue light. NOT pure white — the bg is a cool-tinted #e8ecf1 that avoids glare. White surfaces on muted background gives depth. Think Apple/Linear design.<br><span class="pros">✓ Easy on eyes — no pure-white glare</span> · <span class="pros">✓ Cards clearly elevated (white on gray)</span> · <span class="pros">✓ Professional, modern feel</span> · <span class="cons">⚠ Light themes can feel less "developer-y"</span>`,

  frost: `<strong>Option F: Frost</strong> <span class="new" style="font-size:0.7rem;background:#3b82f633;color:#60a5fa;padding:1px 6px;border-radius:8px">NEW</span> — Slightly cooler and brighter than Mist. Near-white bg #f0f4f8 with slate-blue tint. Crisper borders, more contrast. Think Notion/Linear light mode.<br><span class="pros">✓ Maximum readability and contrast</span> · <span class="pros">✓ Cool-slate tint avoids clinical white</span> · <span class="cons">⚠ Brightest option — may be too light for dim rooms</span>`,
};

// Render all panels
const container = document.createElement('div');
for (const [id, c] of Object.entries(T)) {
  container.innerHTML += buildPanel(id, c, id, descs[id]);
}
document.body.appendChild(container);

function show(id) {
  document.querySelectorAll('.theme-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.theme-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
}
</script>
</body>
</html>
