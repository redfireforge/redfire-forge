# RedfireForge CLI — sample test file
# Run: npx redfireforge run examples/sample-api-test.yaml -c 5 -i 20

name: Sample API Smoke Test
baseUrl: https://httpbin.org

defaults:
  headers:
    Accept: application/json
  timeout: 10
  retries: 1

config:
  concurrency: 3
  iterations: 10
  mode: batch

tests:
  - name: List Users
    url: /get?type=users
    method: GET
    validation:
      mode: selective
      expectedFields:
        - jsonPath: "$.args.type"
          expectedValue: "users"

  - name: Get Single User
    url: /get?userId=1&name=Alice
    method: GET
    validation:
      mode: selective
      expectedFields:
        - jsonPath: "$.args.name"
          expectedValue: "Alice"

  - name: List Posts
    url: /get?type=posts
    method: GET
    weight: 2

  - name: Create Post
    url: /post
    method: POST
    headers:
      Content-Type: application/json
    body: |
      {
        "title": "Performance Test",
        "body": "Created by RedfireForge CLI",
        "userId": 1
      }
    validation:
      mode: selective
      expectedFields:
        - jsonPath: "$.json.title"
          expectedValue: "Performance Test"
