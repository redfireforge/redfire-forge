# CLI Basic Test Example
# A simple test file demonstrating basic CLI usage
#
# Run with (build first, then execute):
#   npm run build:cli
#   node dist-cli/redfireforge.mjs run examples/cli-basic-test.yaml
#
# With options:
#   node dist-cli/redfireforge.mjs run examples/cli-basic-test.yaml -c 5 -i 50
#
# Run only smoke tests:
#   node dist-cli/redfireforge.mjs run examples/cli-basic-test.yaml --scenario-tags smoke
#
# Run only critical AND regression tests:
#   node dist-cli/redfireforge.mjs run examples/cli-basic-test.yaml --scenario-tags critical,regression --scenario-tag-mode all

name: CLI Basic Test
env: demo
baseUrl: https://jsonplaceholder.typicode.com

tests:
  - name: List Users
    method: GET
    url: /users
    tags: [smoke, regression]
    headers:
      Accept: application/json
    assertions:
      - type: status
        expected: "200"
      - type: numeric
        jsonPath: $.length
        operator: ">"
        value: 0

  - name: Get Single User
    method: GET
    url: /users/1
    tags: [smoke, critical]
    headers:
      Accept: application/json
    assertions:
      - type: status
        expected: "200"
      - type: existence
        jsonPath: $.name
        expectExists: true

  - name: List Posts
    method: GET
    url: /posts
    tags: [regression]
    headers:
      Accept: application/json
    assertions:
      - type: status
        expected: "200"
