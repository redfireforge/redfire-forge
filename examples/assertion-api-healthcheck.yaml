# RedfireForge CLI — API Health Check Assertions (Easy)
# Preset: API Health Check
# Verifies a health endpoint returns 2xx and the response contains expected structure.
#
# Run: npx redfireforge run examples/assertion-api-healthcheck.yaml --base-url https://httpbin.org

name: API Health Check
baseUrl: https://httpbin.org

defaults:
  headers:
    Accept: application/json
  timeout: 10

config:
  concurrency: 1
  iterations: 3

tests:
  - name: Health Endpoint Returns OK
    url: /get?svc=auth&svc=api&svc=db
    method: GET
    validation:
      mode: none
      assertions:
        # Assert the HTTP status is in the 2xx range
        - type: status
          expected: "2xx"

        # Assert the response contains the expected query params
        - type: exists
          jsonPath: "$.args.svc"
