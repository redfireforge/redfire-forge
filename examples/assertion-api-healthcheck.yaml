# RedfireForge CLI — API Health Check Assertions (Easy)
# Preset: API Health Check
# Verifies a health endpoint returns 2xx and the response array has at least one entry.
#
# Run: npx redfireforge run examples/assertion-api-healthcheck.yaml --base-url https://jsonplaceholder.typicode.com

name: API Health Check
baseUrl: https://jsonplaceholder.typicode.com

defaults:
  headers:
    Accept: application/json
  timeout: 10

config:
  concurrency: 1
  transactions: 3

tests:
  - name: Health Endpoint Returns Services
    url: /users
    method: GET
    validation:
      mode: none
      assertions:
        # Assert the HTTP status is in the 2xx range
        - type: status
          expected: "2xx"

        # Assert the root array has at least 1 item
        - type: arrayLength
          jsonPath: "$"
          operator: ">="
          value: 1
