# RedfireForge Workflow — Easy: User Lookup & Greeting
# A simple linear workflow that fetches a user, checks their status,
# and sends a welcome or re-engagement message.
#
# Difficulty: ★☆☆ (Easy)
# Features demonstrated:
#   • Start with input variables
#   • HTTP node with response extractions
#   • SetVariable for data transformation
#   • Condition for branching
#   • Two HTTP branches merging to End
#
# Flow:
#   Start (userId=1)
#     → GET /users/:id (extract name, email, status)
#       → SetVariable (build greeting message)
#         → Condition (status == "active"?)
#           ├─ Yes → POST /notifications/welcome
#           └─ No  → POST /notifications/reactivate
#             → End

name: User Lookup & Greeting
description: >
  Fetch a user profile, check their account status, and send an
  appropriate notification. Great for learning basic workflow concepts.

schemaVersion: 5

variables:
  apiBase: "https://jsonplaceholder.typicode.com"

nodes:
  - id: start-1
    type: start
    position: { x: 300, y: 0 }
    data:
      label: Start
      inputVariables:
        userId: "1"
        status: "active"

  - id: http-get-user
    type: http
    position: { x: 300, y: 140 }
    data:
      label: Fetch User Profile
      scenario:
        id: sc-get-user
        name: Fetch User
        url: "{{apiBase}}/users/{{userId}}"
        method: GET
        headers:
          - key: Accept
            value: application/json
        body: ""
        bodyForm: []
        auth: { type: none }
        validation:
          mode: none
          assertions:
            - type: status
              expected: "200"
        extractions:
          - name: userName
            source: body
            expression: $.name
          - name: userEmail
            source: body
            expression: $.email
          - name: userCompany
            source: body
            expression: $.company.name

  - id: setvar-greeting
    type: setVariable
    position: { x: 300, y: 300 }
    data:
      label: Build Greeting
      assignments:
        - id: a1
          name: greeting
          expression: "$concat('Hello ', '{{userName}}', '! Welcome from ', '{{userCompany}}')"
        - id: a2
          name: subject
          expression: "$if($equals('{{status}}', 'active'), 'Welcome Back', 'We Miss You')"

  - id: cond-active
    type: condition
    position: { x: 300, y: 440 }
    data:
      label: Is Active?
      left: "{{status}}"
      operator: "=="
      right: "active"

  # ── Active branch ──
  - id: http-welcome
    type: http
    position: { x: 100, y: 600 }
    data:
      label: Send Welcome
      scenario:
        id: sc-welcome
        name: Send Welcome Notification
        url: "{{apiBase}}/posts"
        method: POST
        headers:
          - key: Content-Type
            value: application/json
        body: |
          {
            "title": "{{subject}}",
            "body": "{{greeting}}",
            "userId": {{userId}}
          }
        bodyForm: []
        auth: { type: none }
        validation:
          mode: none
          assertions:
            - type: status
              expected: "201"

  # ── Inactive branch ──
  - id: http-reactivate
    type: http
    position: { x: 500, y: 600 }
    data:
      label: Send Reactivation
      scenario:
        id: sc-reactivate
        name: Send Reactivation Notification
        url: "{{apiBase}}/posts"
        method: POST
        headers:
          - key: Content-Type
            value: application/json
        body: |
          {
            "title": "{{subject}}",
            "body": "{{greeting}} — It's been a while!",
            "userId": {{userId}}
          }
        bodyForm: []
        auth: { type: none }
        validation:
          mode: none

  - id: end-1
    type: end
    position: { x: 300, y: 760 }
    data:
      label: Done

edges:
  - id: e-start-user
    source: start-1
    target: http-get-user

  - id: e-user-greeting
    source: http-get-user
    target: setvar-greeting

  - id: e-greeting-cond
    source: setvar-greeting
    target: cond-active

  - id: e-cond-welcome
    source: cond-active
    target: http-welcome
    sourceHandle: "true"

  - id: e-cond-reactivate
    source: cond-active
    target: http-reactivate
    sourceHandle: "false"

  - id: e-welcome-end
    source: http-welcome
    target: end-1

  - id: e-reactivate-end
    source: http-reactivate
    target: end-1
