# Workflow CLI Conditional Example
# Demonstrates conditional branching via a Switch node, driven by --var overrides
#
# Run with default settings:
#   npx tsx cli/index.ts workflow examples/workflow-cli-conditional.yaml
#
# Try different countries:
#   npx tsx cli/index.ts workflow examples/workflow-cli-conditional.yaml --var country=germany
#   npx tsx cli/index.ts workflow examples/workflow-cli-conditional.yaml --var country=japan
#
# Load test:
#   npx tsx cli/index.ts workflow examples/workflow-cli-conditional.yaml -i 30 -c 3
#
# Note: the Switch branches on the `country` variable itself (not on an HTTP response
# field) — restcountries.com's v3.1 API (used below purely to demonstrate a real HTTP
# call with variable substitution) was deprecated after this fixture was first authored
# and now always returns an error body, so it can no longer drive real branching logic.

name: Conditional Country Lookup
description: Look up a country, then branch on the requested country/region

variables:
  country: "france"

nodes:
  - id: start
    type: start
    position: { x: 300, y: 0 }
    data:
      label: Start

  - id: lookup-country
    type: http
    position: { x: 250, y: 100 }
    data:
      label: Lookup Country
      method: GET
      url: https://restcountries.com/v3.1/name/{{country}}
      headers:
        Accept: application/json

  - id: check-region
    type: switch
    position: { x: 300, y: 220 }
    data:
      label: Check Region
      expression: "{{country}}"
      cases:
        - id: c-germany
          value: germany
          label: Germany (Europe)
        - id: c-japan
          value: japan
          label: Japan (Asia)

  - id: european-action
    type: http
    position: { x: 100, y: 350 }
    data:
      label: European Country
      method: GET
      url: https://jsonplaceholder.typicode.com/users/2

  - id: asian-action
    type: http
    position: { x: 300, y: 350 }
    data:
      label: Asian Country
      method: GET
      url: https://jsonplaceholder.typicode.com/users/3

  - id: other-region
    type: http
    position: { x: 500, y: 350 }
    data:
      label: Other Region
      method: GET
      url: https://jsonplaceholder.typicode.com/users/1

  - id: end-1
    type: end
    position: { x: 300, y: 480 }
    data:
      label: End

edges:
  - id: e1
    source: start
    target: lookup-country
  - id: e2
    source: lookup-country
    target: check-region
  - id: e3
    source: check-region
    target: european-action
    sourceHandle: case-c-germany
  - id: e4
    source: check-region
    target: asian-action
    sourceHandle: case-c-japan
  - id: e5
    source: check-region
    target: other-region
    sourceHandle: default
  - id: e6
    source: european-action
    target: end-1
  - id: e7
    source: asian-action
    target: end-1
  - id: e8
    source: other-region
    target: end-1
