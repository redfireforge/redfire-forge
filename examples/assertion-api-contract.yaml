# RedfireForge CLI — Full API Contract Assertions (Advanced)
# Preset: API Contract
# Complete contract validation — exact values, numeric ranges, and format checks.
#
# Run: npx redfireforge run examples/assertion-api-contract.yaml --base-url https://jsonplaceholder.typicode.com

name: Full API Contract
baseUrl: https://jsonplaceholder.typicode.com

defaults:
  headers:
    Accept: application/json
  timeout: 10

config:
  concurrency: 2
  transactions: 5

tests:
  - name: Post #1 Matches Full Contract
    url: /posts/1
    method: GET
    validation:
      mode: none
      assertions:
        # Assert HTTP 200
        - type: status
          expected: "200"

        # Assert userId is within range 1–10
        - type: numeric
          jsonPath: "$.userId"
          operator: ">="
          value: 1
        - type: numeric
          jsonPath: "$.userId"
          operator: "<="
          value: 10

        # Assert post id = 1
        - type: numeric
          jsonPath: "$.id"
          operator: "="
          value: 1

        # Assert title has at least 3 characters
        - type: regex
          jsonPath: "$.title"
          pattern: ".{3,}"

  - name: User #1 Contract
    url: /users/1
    method: GET
    validation:
      mode: none
      assertions:
        - type: status
          expected: "200"
        - type: numeric
          jsonPath: "$.id"
          operator: "="
          value: 1
        - type: regex
          jsonPath: "$.email"
          pattern: "^[^@]+@[^@]+\\.[^@]+$"
        - type: regex
          jsonPath: "$.phone"
          pattern: "^[0-9\\-\\.x ]+$"
