# RedfireForge CLI — Full API Contract Assertions (Advanced)
# Preset: API Contract
# Complete contract validation — exact values, numeric ranges, and format checks.
#
# Run: npx redfireforge run examples/assertion-api-contract.yaml --base-url https://httpbin.org

name: Full API Contract
baseUrl: https://httpbin.org

defaults:
  headers:
    Accept: application/json
  timeout: 30

config:
  concurrency: 1
  iterations: 3

tests:
  - name: Post Data Matches Contract
    url: /post
    method: POST
    headers:
      Content-Type: application/json
    body: '{"userId": 5, "id": 1, "title": "Contract Test Post", "email": "user@example.com", "phone": "1-234-567-8901"}'
    validation:
      mode: none
      assertions:
        # Assert HTTP 200
        - type: status
          expected: "200"

        # Assert userId is within range 1–10
        - type: numeric
          jsonPath: "$.json.userId"
          operator: ">="
          value: 1
        - type: numeric
          jsonPath: "$.json.userId"
          operator: "<="
          value: 10

        # Assert id = 1
        - type: numeric
          jsonPath: "$.json.id"
          operator: "="
          value: 1

        # Assert title has at least 3 characters
        - type: regex
          jsonPath: "$.json.title"
          pattern: ".{3,}"

  - name: User Data Contract
    url: /post
    method: POST
    headers:
      Content-Type: application/json
    body: '{"id": 1, "email": "user@example.com", "phone": "1-234-567-8901"}'
    validation:
      mode: none
      assertions:
        - type: status
          expected: "200"
        - type: numeric
          jsonPath: "$.json.id"
          operator: "="
          value: 1
        - type: regex
          jsonPath: "$.json.email"
          pattern: "^[^@]+@[^@]+\\.[^@]+$"
        - type: regex
          jsonPath: "$.json.phone"
          pattern: "^[0-9\\-\\.x ]+$"
