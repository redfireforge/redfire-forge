version: 2
updates:
  # npm — root workspace (covers packages/* via npm workspaces, e.g. demo-hub)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # monaco-graphql@latest requires monaco-editor < 0.53 — hold until
      # monaco-graphql ships a release that supports 0.53+.
      - dependency-name: monaco-editor
        versions: [">= 0.53"]
    groups:
      # Batch minor/patch updates into one PR per week instead of one per package
      minor-and-patch:
        update-types: [minor, patch]

  # npm — CLI package
  - package-ecosystem: npm
    directory: /cli
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Cargo — Tauri / Rust deps
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
