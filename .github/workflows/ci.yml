name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - master

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      demo: ${{ steps.filter.outputs.demo }}
      product: ${{ steps.filter.outputs.product }}
      grpc: ${{ steps.filter.outputs.grpc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            demo:
              - 'packages/demo-hub/**'
              - 'src/app/demo/**'
              - 'src/config/features.ts'
              - 'src/**/useDemo*.ts'
              - 'src/features/graphql/DemoGqlStudioBridges.tsx'
              - 'src/app/components/AppLiveDemoOverlay.tsx'
              - 'src/app/components/AppLiveDemoOverlay.test.tsx'
              - '.env.production.demo'
              - 'src-tauri/tauri.conf.demo.json'
              - 'e2e/demo-**'
              - 'e2e/demo-player-helpers.ts'
              - 'e2e/graphql-lesson-smoke-helpers.ts'
              - 'e2e/graphql-demo-workspace-helpers.ts'
              - '.github/workflows/demo-nightly.yml'
              - 'vitest.projectPatterns.ts'
              - 'vitest.config.ts'
              - 'scripts/product-coverage-filter.ts'
              - 'src/test-utils/vitestProjectSplit.test.ts'
            product:
              - 'src/**'
              - 'cli/**'
              - 'src-server/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'vitest.projectPatterns.ts'
            grpc:
              - 'src/features/grpc/**'
              - 'src-server/grpc/**'
              - 'src/shared/grpc/**'
              - 'scripts/grpc-*.mjs'
              - 'scripts/grpc-*.ts'
              - 'package.json'
              - 'package-lock.json'

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit

  grpc-phase13a-slo:
    name: gRPC Phase 13A SLO Gate
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: |
      needs.changes.outputs.grpc == 'true' &&
      (github.event_name == 'pull_request' ||
       github.ref == 'refs/heads/develop' ||
       startsWith(github.ref, 'refs/heads/release/'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start API server
        run: npm run server > /tmp/redfire-grpc-server.log 2>&1 & echo $! > /tmp/redfire-grpc-server.pid
      - name: Wait for gRPC usage route
        run: |
          for i in {1..40}; do
            if curl --noproxy '*' -sSf http://127.0.0.1:3001/api/grpc/describe/usage > /dev/null; then
              echo "gRPC route ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          cat /tmp/redfire-grpc-server.log || true
          exit 1
      - name: Run Phase 13A SLO gate
        run: npm run grpc:phase13a:gate -- --require-live --base-url=http://127.0.0.1:3001
      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13a-baseline
          path: artifacts/grpc-phase13a-baseline.json
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/redfire-grpc-server.pid ]; then
            kill "$(cat /tmp/redfire-grpc-server.pid)" || true
          fi

  grpc-phase13b-slo:
    name: gRPC Phase 13B Probe Gate
    runs-on: ubuntu-latest
    needs: [typecheck, grpc-phase13a-slo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Phase 13B fixture-backed gate
        run: npm run grpc:phase13b:ci
      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13b-baseline
          path: artifacts/grpc-phase13b-baseline.ci.json
      - name: Upload transport parity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13b-transport-parity
          path: artifacts/grpc-transport-parity-matrix.ci.json

  grpc-phase13c-drills:
    name: gRPC Phase 13C Failure Drills
    runs-on: ubuntu-latest
    needs: [typecheck, grpc-phase13b-slo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start API server
        run: npm run server > /tmp/redfire-grpc-phase13c-server.log 2>&1 & echo $! > /tmp/redfire-grpc-phase13c-server.pid
      - name: Wait for gRPC usage route
        run: |
          for i in {1..40}; do
            if curl --noproxy '*' -sSf http://127.0.0.1:3001/api/grpc/describe/usage > /dev/null; then
              echo "gRPC route ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          cat /tmp/redfire-grpc-phase13c-server.log || true
          exit 1
      - name: Run Phase 13C failure drills
        run: npm run grpc:phase13c:gate -- --base-url=http://127.0.0.1:3001
      - name: Upload drill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13c-drills
          path: artifacts/grpc-phase13c-drills.json
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/redfire-grpc-phase13c-server.pid ]; then
            kill "$(cat /tmp/redfire-grpc-phase13c-server.pid)" || true
          fi

  grpc-phase13d-recovery:
    name: gRPC Phase 13D Recovery Drills
    runs-on: ubuntu-latest
    needs: [typecheck, grpc-phase13c-drills]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start API server
        run: npm run server > /tmp/redfire-grpc-phase13d-server.log 2>&1 & echo $! > /tmp/redfire-grpc-phase13d-server.pid
      - name: Wait for gRPC usage route
        run: |
          for i in {1..40}; do
            if curl --noproxy '*' -sSf http://127.0.0.1:3001/api/grpc/describe/usage > /dev/null; then
              echo "gRPC route ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          cat /tmp/redfire-grpc-phase13d-server.log || true
          exit 1
      - name: Run Phase 13D recovery drills
        run: npm run grpc:phase13d:gate -- --base-url=http://127.0.0.1:3001
      - name: Upload recovery drill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13d-recovery
          path: artifacts/grpc-phase13d-recovery.json
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/redfire-grpc-phase13d-server.pid ]; then
            kill "$(cat /tmp/redfire-grpc-phase13d-server.pid)" || true
          fi

  grpc-phase13e-a11y:
    name: gRPC Phase 13E Accessibility and Virtualization Gate
    runs-on: ubuntu-latest
    needs: [typecheck, grpc-phase13d-recovery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Phase 13E a11y + virtualization gate
        run: npm run grpc:phase13e:gate
      - name: Upload a11y artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13e-a11y
          path: artifacts/grpc-phase13e-a11y.json

  grpc-phase13f-observability:
    name: gRPC Phase 13F Observability and Redaction Audit Gate
    runs-on: ubuntu-latest
    needs: [typecheck, grpc-phase13e-a11y]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Phase 13F observability + redaction gate
        run: npm run grpc:phase13f:gate
      - name: Upload observability audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13f-observability
          path: artifacts/grpc-phase13f-observability.json

  grpc-phase13h-rollback:
    name: gRPC Phase 13H Operational Rollback Drill Gate
    runs-on: ubuntu-latest
    needs: [typecheck, grpc-phase13f-observability]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start API server
        run: npm run server > /tmp/redfire-grpc-phase13h-server.log 2>&1 & echo $! > /tmp/redfire-grpc-phase13h-server.pid
      - name: Wait for gRPC usage route
        run: |
          for i in {1..40}; do
            if curl --noproxy '*' -sSf http://127.0.0.1:3001/api/grpc/describe/usage > /dev/null; then
              echo "gRPC route ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          cat /tmp/redfire-grpc-phase13h-server.log || true
          exit 1
      - name: Run Phase 13H rollback drill gate
        run: npm run grpc:phase13h:gate -- --base-url=http://127.0.0.1:3001
      - name: Upload rollback drill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13h-rollback
          path: artifacts/grpc-phase13h-rollback-drill.json
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/redfire-grpc-phase13h-server.pid ]; then
            kill "$(cat /tmp/redfire-grpc-phase13h-server.pid)" || true
          fi

  grpc-phase13i-ga-signoff:
    name: gRPC Phase 13I Final GA Sign-off
    runs-on: ubuntu-latest
    needs: [typecheck, grpc-phase13h-rollback]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download transport parity artifact
        uses: actions/download-artifact@v4
        with:
          name: grpc-phase13b-transport-parity
          path: artifacts/
      - name: Download Phase 13C artifact
        uses: actions/download-artifact@v4
        with:
          name: grpc-phase13c-drills
          path: artifacts/
      - name: Download Phase 13D artifact
        uses: actions/download-artifact@v4
        with:
          name: grpc-phase13d-recovery
          path: artifacts/
      - name: Download Phase 13E artifact
        uses: actions/download-artifact@v4
        with:
          name: grpc-phase13e-a11y
          path: artifacts/
      - name: Download Phase 13F artifact
        uses: actions/download-artifact@v4
        with:
          name: grpc-phase13f-observability
          path: artifacts/
      - name: Download Phase 13H artifact
        uses: actions/download-artifact@v4
        with:
          name: grpc-phase13h-rollback
          path: artifacts/
      - name: Run Phase 13I final GA sign-off gate
        run: npm run grpc:phase13i:gate
      - name: Upload GA sign-off artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13i-ga-signoff
          path: artifacts/grpc-phase13i-ga-signoff.json

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/ cli/

  unit-tests-product:
    name: Unit Tests (product)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: needs.changes.outputs.product == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run product coverage (2 shards — matches CI runner vCPU count)
        run: npm run test:product:coverage:fast
        env:
          COVERAGE_SHARDS: 2
      - name: Check coverage thresholds
        run: |
          echo "Product coverage report generated. Review in PR for >90% target."

  unit-tests-demo:
    name: Unit Tests (demo)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:demo

  build-frontend:
    name: Frontend Build (vite)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: npm run audit:prod-demo-bundle
      - name: Verify dist output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ Build failed — dist/index.html not found"
            exit 1
          fi
          echo "✅ Frontend build successful"
          du -sh dist/

  e2e-demo-gql5:
    name: E2E Demo GQL-5 (Docker)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: |
      needs.changes.outputs.demo == 'true' &&
      (github.event_name == 'pull_request' ||
       github.ref == 'refs/heads/develop' ||
       startsWith(github.ref, 'refs/heads/release/'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run GQL-5 demo E2E (TLS + mTLS + plain GraphQL)
        env:
          E2E_GQL5_DOCKER: '1'
          E2E_DOCKER_TEARDOWN: '1'
        run: npm run test:e2e:demo:gql5:ci
