name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - master

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      demo: ${{ steps.filter.outputs.demo }}
      product: ${{ steps.filter.outputs.product }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            demo:
              - 'packages/demo-hub/**'
              - 'src/app/demo/**'
              - 'src/config/features.ts'
              - 'src/**/useDemo*.ts'
              - 'src/features/graphql/DemoGqlStudioBridges.tsx'
              - 'src/app/components/AppLiveDemoOverlay.tsx'
              - 'src/app/components/AppLiveDemoOverlay.test.tsx'
              - '.env.production.demo'
              - 'src-tauri/tauri.conf.demo.json'
              - 'e2e/demo-**'
              - 'e2e/demo-player-helpers.ts'
              - 'e2e/graphql-lesson-smoke-helpers.ts'
              - 'e2e/graphql-demo-workspace-helpers.ts'
              - '.github/workflows/demo-nightly.yml'
              - 'vitest.projectPatterns.ts'
              - 'vitest.config.ts'
              - 'scripts/product-coverage-filter.ts'
              - 'src/test-utils/vitestProjectSplit.test.ts'
            product:
              - 'src/**'
              - 'cli/**'
              - 'src-server/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'vitest.projectPatterns.ts'
              - 'e2e/**'
              - 'playwright.config.ts'

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/ cli/

  unit-tests-product:
    name: Unit Tests (product)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: needs.changes.outputs.product == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run product coverage (2 shards — matches CI runner vCPU count)
        run: npm run test:product:coverage:fast
        env:
          COVERAGE_SHARDS: 2
      - name: Check coverage thresholds
        run: |
          echo "Product coverage report generated. Review in PR for >90% target."

  unit-tests-demo:
    name: Unit Tests (demo)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:demo

  build-frontend:
    name: Frontend Build (vite)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: npm run audit:prod-demo-bundle
      - name: Verify dist output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ Build failed — dist/index.html not found"
            exit 1
          fi
          echo "✅ Frontend build successful"
          du -sh dist/

  # ── E2E Integration Tests ────────────────────────────────────────────────
  # These run on PRs only — not on direct pushes to develop/release/master.
  # Running after every merge would double the CI cost for no extra signal
  # (the PR already validated the code before merge).

  e2e-grpc:
    name: E2E gRPC Studio
    runs-on: ubuntu-latest
    needs: [typecheck]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run gRPC Studio E2E
        run: npm run test:e2e:grpc:ci
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: grpc-e2e-playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-product:
    name: E2E Product (core — no Docker)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: |
      needs.changes.outputs.product == 'true' &&
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run core product E2E (ci project — ~30 spec files, no Docker)
        run: npm run test:e2e:ci
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: product-e2e-playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-demo-gql5:
    name: E2E Demo GQL-5 (Docker)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: |
      needs.changes.outputs.demo == 'true' &&
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run GQL-5 demo E2E (TLS + mTLS + plain GraphQL)
        env:
          E2E_GQL5_DOCKER: '1'
          E2E_DOCKER_TEARDOWN: '1'
        run: npm run test:e2e:demo:gql5:ci
