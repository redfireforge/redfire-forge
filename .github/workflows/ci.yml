name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - master

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            demo:
              - 'packages/demo-hub/**'
              - 'src/app/demo/**'
              - 'src/config/features.ts'
              - 'src/**/useDemo*.ts'
              - 'src/features/graphql/DemoGqlStudioBridges.tsx'
              - 'src/app/components/AppLiveDemoOverlay.tsx'
              - 'src/app/components/AppLiveDemoOverlay.test.tsx'
              - '.env.production.demo'
              - 'src-tauri/tauri.conf.demo.json'
              - 'e2e/demo-**'
              - 'e2e/demo-player-helpers.ts'
              - 'e2e/graphql-lesson-smoke-helpers.ts'
              - 'e2e/graphql-demo-workspace-helpers.ts'
              - '.github/workflows/demo-nightly.yml'
              - 'vitest.projectPatterns.ts'
              - 'vitest.config.ts'
              - 'scripts/product-coverage-filter.ts'
              - 'src/test-utils/vitestProjectSplit.test.ts'

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit

  grpc-phase13a-slo:
    name: gRPC Phase 13A SLO Gate
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start API server
        run: npm run server > /tmp/redfire-grpc-server.log 2>&1 & echo $! > /tmp/redfire-grpc-server.pid
      - name: Wait for gRPC usage route
        run: |
          for i in {1..40}; do
            if curl -sSf http://127.0.0.1:3001/api/grpc/describe/usage > /dev/null; then
              echo "gRPC route ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          cat /tmp/redfire-grpc-server.log || true
          exit 1
      - name: Run Phase 13A SLO gate
        run: npm run grpc:phase13a:gate -- --require-live --base-url=http://127.0.0.1:3001
      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13a-baseline
          path: artifacts/grpc-phase13a-baseline.json
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/redfire-grpc-server.pid ]; then
            kill "$(cat /tmp/redfire-grpc-server.pid)" || true
          fi

  grpc-phase13b-slo:
    name: gRPC Phase 13B Probe Gate
    runs-on: ubuntu-latest
    needs: [typecheck, grpc-phase13a-slo]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Phase 13B fixture-backed gate
        run: npm run grpc:phase13b:ci
      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grpc-phase13b-baseline
          path: artifacts/grpc-phase13b-baseline.ci.json

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/ cli/

  unit-tests-product:
    name: Unit Tests (product)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:product:coverage
      - name: Check coverage thresholds
        run: |
          echo "Product coverage report generated. Review in PR for >90% target."

  unit-tests-demo:
    name: Unit Tests (demo)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:demo

  build-frontend:
    name: Frontend Build (vite)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: npm run audit:prod-demo-bundle
      - name: Verify dist output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ Build failed — dist/index.html not found"
            exit 1
          fi
          echo "✅ Frontend build successful"
          du -sh dist/

  e2e-demo-gql5:
    name: E2E Demo GQL-5 (Docker)
    runs-on: ubuntu-latest
    needs: [typecheck, changes]
    if: needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run GQL-5 demo E2E (TLS + mTLS + plain GraphQL)
        env:
          E2E_GQL5_DOCKER: '1'
          E2E_DOCKER_TEARDOWN: '1'
        run: npm run test:e2e:demo:gql5:ci
