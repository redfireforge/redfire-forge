name: Build & Release

on:
  push:
    tags:
      - 'v*'
    # Explicit branch triggers let the guard job run on branch pushes so
    # GitHub shows ✅ instead of "workflow file issue" (which occurs when
    # the workflow fires via a phantom tag-context evaluation but all jobs
    # are skipped and 0 jobs complete).
    branches:
      - master
      - develop
      - 'release/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (standard = prod slim, demo = Learning Hub)'
        required: true
        default: standard
        type: choice
        options:
          - standard
          - demo
          - both

jobs:
  # Runs only on non-tag pushes so GitHub always has at least one completed job
  # and reports the workflow as ✅ instead of "workflow file issue" (which
  # happens when every job is skipped).
  guard:
    name: Skip (not a tag push)
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - run: echo "Not a tag push — build jobs skipped."

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64
            variant: standard
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64-Demo
            variant: demo
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
            variant: standard
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64-Demo
            variant: demo
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            variant: standard
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64-Demo
            variant: demo
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            variant: standard
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64-Demo
            variant: demo

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.variant == 'both' || inputs.variant == matrix.variant)) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && ((endsWith(github.ref_name, '-demo') && matrix.variant == 'demo') || (!endsWith(github.ref_name, '-demo') && matrix.variant == 'standard')))

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (standard)
        if: matrix.variant == 'standard'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing & notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing (signs the update payload so the app trusts it)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RedfireForge ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform below.'
          releaseDraft: true
          prerelease: false
          updaterJsonFileName: latest.json
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

      - name: Build Tauri app (Learning Hub)
        if: matrix.variant == 'demo'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing & notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RedfireForge Learning Hub ${{ github.ref_name }}'
          releaseBody: 'Learning Hub build with interactive tutorials. Download the installer for your platform below.'
          releaseDraft: true
          prerelease: false
          updaterJsonFileName: latest-demo.json
          updaterJsonPreferNsis: true
          assetNamePattern: 'RedfireForge-LearningHub-[version]-[platform]-[arch][ext]'
          args: --target ${{ matrix.target }} --config src-tauri/tauri.conf.demo.json

      - name: Cleanup macOS keychain
        if: matrix.platform == 'macos-latest' && always()
        run: security delete-keychain build.keychain 2>/dev/null || true

  sbom:
    name: Generate SBOM
    needs: build
    # Only for an actual tag push — a manual workflow_dispatch test run has no
    # tag to attach the asset to.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          # This workflow triggers on `push: tags`, not the native `release`
          # event, and tauri-action (not this action) owns release creation —
          # disable the action's own auto-upload heuristic so there is exactly
          # one, explicit upload path below instead of two ambiguous ones.
          upload-release-assets: false

      - name: Upload SBOM to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # tauri-action creates the (draft) release per matrix leg above; attach
        # the SBOM as an extra asset via the tag name rather than the
        # deprecated actions/upload-release-asset@v1 + upload_url pattern.
        run: gh release upload "${{ github.ref_name }}" sbom.spdx.json --clobber
