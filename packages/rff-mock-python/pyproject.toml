[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pytest-rff-mock"
version = "0.1.0"
description = "pytest fixtures for RedfireForge API Mock — auto port, wait-ready, teardown"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["pytest", "api-mock", "redfireforge", "testing"]
classifiers = [
  "Framework :: Pytest",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
]
dependencies = ["pytest>=7.0"]

[project.entry-points."pytest11"]
rff_mock = "rff_mock.fixtures"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
